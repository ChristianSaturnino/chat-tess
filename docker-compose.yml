services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tess
      POSTGRES_PASSWORD: tess
      POSTGRES_DB: tess
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
